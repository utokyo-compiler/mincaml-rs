[package]
name = "parser"
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["plex", "lalrpop"]
lalrpop = ["dep:lalrpop", "dep:lalrpop-util"]

[build-dependencies]
lalrpop = { workspace = true, optional = true }

[dependencies]
plex = { workspace = true, optional = true }
peg = { workspace = true, optional = true }
lalrpop-util = { workspace = true, optional = true }
thiserror.workspace = true

data_structure.workspace = true
syntax.workspace = true
sourcemap.workspace = true
